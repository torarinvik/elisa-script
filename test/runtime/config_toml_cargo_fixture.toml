# Snapshot adapted verbatim from ../WasmBrowser/Cargo.toml, whose SHA-256 was
# d69c6241c9f1768b45caa2965eb2c125af2826d97fd06ed3cd766691dbc2c1c1 on 2026-09-24.
[workspace]
resolver = "2"
members = [
    "crates/wb-manifest",
    "crates/wb-protocol",
    "crates/wb-storage",
    "crates/wb-media",
    "crates/wb-webrtc",
    "crates/wb-stream",
    "crates/wb-transport",
    "crates/wb-server",
    "crates/wb-loader",
    "crates/wb-commerce",
    "crates/wb-crypto-ffi",
    "crates/wb-runtime",
    "crates/wb-text",
    "crates/wb-shell",
    "crates/wb-ffi",
    "crates/wb-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
wb-manifest = { path = "crates/wb-manifest" }
wb-protocol = { path = "crates/wb-protocol" }
wb-storage = { path = "crates/wb-storage" }
wb-media = { path = "crates/wb-media" }
wb-stream = { path = "crates/wb-stream" }
wb-webrtc = { path = "crates/wb-webrtc" }
wb-transport = { path = "crates/wb-transport" }
wb-server = { path = "crates/wb-server" }
wb-loader = { path = "crates/wb-loader" }
wb-commerce = { path = "crates/wb-commerce" }
wb-runtime = { path = "crates/wb-runtime" }
wb-text = { path = "crates/wb-text" }
wb-shell = { path = "crates/wb-shell" }
wasmtime = { version = "48", features = ["component-model"] }
wasmtime-wasi = "48"
bytes = "1"
tokio = { version = "1", features = ["io-util", "sync"] }
wgpu = "30"
winit = { version = "0.30", features = ["android-native-activity"] }
egui = "0.36"
epaint = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
gilrs = "0.11.2"
arboard = "3.6"
rodio = "0.22"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "8"
ureq = "3"
dirs = "6"
sha2 = "0.10"
zstd = "0.13"
rav1e = { version = "0.8.1", default-features = false }
dav1d = { version = "0.11.1", default-features = false }
str0m = { version = "0.23.1", default-features = false, features = ["rust-crypto"] }
opus = "0.4"
hmac = "0.13"
ring = "0.17"
sha2_11 = { package = "sha2", version = "0.11" }
getrandom = "0.3"
libc = "0.2"
mach2 = "0.6.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
wasmparser = "0.258"
anyhow = "1"
