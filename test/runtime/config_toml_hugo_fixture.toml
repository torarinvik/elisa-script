# Selected-value test fixture adapted from ../elisa-skia/site/config.toml.
# Source SHA-256: bb5b172a0c7aedb991b20efa65f76ae83341e6413585f54ef28fb23065da6fb1
baseURL = "/"
title = "Skia"

enableRobotsTXT = false

# Hugo allows theme composition (and inheritance). The precedence is from left to right.
theme = ["docsy"]

# Will give values to .Lastmod etc.
enableGitInfo = false

disableKinds = ["taxonomy", "taxonomyTerm"]

# Highlighting config
pygmentsCodeFences = true
pygmentsUseClasses = false
# Use the new Chroma Go highlighter in Hugo.
pygmentsUseClassic = false
#pygmentsOptions = "linenos=table"
# See https://help.farbox.com/pygments.html
pygmentsStyle = "tango"

# Configure how URLs look per section.
[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

## Configuration for BlackFriday markdown parser: https://github.com/russross/blackfriday
[blackfriday]
plainIDAnchors = true
hrefTargetBlank = true
angledQuotes = false
latexDashes = true

# Image processing configuration.
[imaging]
resampleFilter = "CatmullRom"
quality = 75
anchor = "smart"

[services]
[services.googleAnalytics]
# Comment out the next line to disable GA tracking. Also disables the feature described in [params.ui.feedback].
id = "UA-18058-16"

# Language configuration
[languages]
[languages.en]
title = "Skia"
description = "2D Graphics Library"
languageName ="English"
# Weight used for sorting.
weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
      # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
      style = "tango"
      # Uncomment if you want your chosen highlight to be used for code blocks without a specified style.
      # guessSyntax = "true"

# Everything below this are Site Params
[params]
copyright = "Google"
privacy_policy = "https://policies.google.com/privacy"

# First one is picked as the Twitter card image if not set on page.
# images = ["images/project-illustration.png"]

# Menu title if your navbar has a versions selector to access previous versions.
# This menu appears only when at least one [params.versions] is set.
version_menu = "Releases"

# Flag used to add a version banner on every page.
archived_version = false

# Version number for the version of the docs represented here.
version = "0.0"

# URL to latest version.
url_latest_version = "https://skia.org"

# Repository configuration for issue and contribution links.
# github_repo = "https://github.com/google/skia"
# github_project_repo = "https://github.com/google/docsy"
# github_subdir = "site2"
# github_branch = "main"

# Google Custom Search Engine ID. Remove or comment out to disable search.
gcs_engine_id = "009791159600898516779:8-nlv0iznho"

# Enable Algolia DocSearch.
algolia_docsearch = false

# Enable Lunr.js offline search.
offlineSearch = false

# Enable syntax highlighting and copy buttons with Prism.
prism_syntax_highlighting = false

# User interface configuration.
[params.ui]
sidebar_menu_compact = false
breadcrumb_disable = false
sidebar_search_disable = false
navbar_logo = false
footer_about_disable = false

# Feedback section config depends on services.googleAnalytics.
[params.ui.feedback]
enable = false
yes = 'Glad to hear it! Please <a href="https://bugs.chromium.org/p/skia/issues/entry">tell us how we can improve</a>.'
no = 'Sorry to hear it! Please <a href="https://bugs.chromium.org/p/skia/issues/entry">tell us how we can improve</a>.'

# Reading-time display configuration.
[params.ui.readingtime]
enable = false

[params.links]
# End-user relevant links.
[[params.links.user]]
	name = "User mailing list"
	url = "https://groups.google.com/g/skia-discuss"
	icon = "fa fa-envelope"
        desc = "Discussion and help"

# Developer-relevant links.
[[params.links.developer]]
	name = "GitHub"
	url = "https://github.com/google/skia"
	icon = "fab fa-github"
        desc = "Development takes place here!"

[params.mermaid]
enable = true
